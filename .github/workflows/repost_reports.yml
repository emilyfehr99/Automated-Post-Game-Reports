name: Repost Yesterday's Reports

on:
  schedule:
    # Times (UTC) corresponding to CT Morning Windows
    # Mon, Tue, Thu, Fri: 8 AM CT -> 14:00 UTC
    - cron: '0 14 * * 1,2,4,5'
    # Wed: 9 AM CT -> 15:00 UTC
    - cron: '0 15 * * 3'
    # Sat: 9 AM CT -> 15:00 UTC
    - cron: '0 15 * * 6'
    # Sun: 11 AM CT -> 17:00 UTC
    - cron: '0 17 * * 0'
  workflow_dispatch:  # Allow manual triggering

jobs:
  repost-reports:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Check Active Schedule
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          echo "✅ Manual Dispatch Triggered!"
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          has_games=$(python3 -c "
import urllib.request, json
try:
    req = urllib.request.Request('https://api-web.nhle.com/v1/schedule/now', headers={'User-Agent': 'Mozilla/5.0'})
    with urllib.request.urlopen(req, timeout=10) as r:
        data = json.loads(r.read().decode('utf-8'))
    has_games = any(bool(day.get('games')) for day in (data.get('gameWeek') or []))
    print('true' if has_games else 'false')
except Exception as e:
    print('true')
" 2>/dev/null || echo "true")
          if [[ "$has_games" == "true" ]]; then
            echo "✅ Active games scheduled in current gameWeek!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏸️ No games scheduled for active week. Skipping run."
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        fi
      id: check_date
    - name: Checkout repository
      if: steps.check_date.outputs.should_run == 'true'
      uses: actions/checkout@v4
      
    - name: Set up Python
      if: steps.check_date.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      if: steps.check_date.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install tweepy pytz
        
    - name: Repost Yesterday's Reports
      if: steps.check_date.outputs.should_run == 'true'
      env:
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}

      run: |
        PYTHONPATH=".:models:analyzers:utils:scrapers:api" python utils/repost_yesterdays_reports.py
