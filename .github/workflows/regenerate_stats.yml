name: Regenerate Team Stats

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '0 9 * * *'  # Run daily at 9 AM UTC (4 AM EST)

jobs:
  regenerate-stats:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write  # Allow pushing changes back to repo
      
    steps:
      - name: Check Season Active
        run: |
          current_date=$(date +%Y-%m-%d)
          if [[ "$current_date" > "2026-06-25" && "$current_date" < "2026-09-28" && "${{ github.event_name }}" != "workflow_dispatch" ]]; then
            echo "⏸️ Off-Season: No games scheduled until Opening Day (Sept 29, 2026)."
            echo "Skipping off-season run."
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Season / Manual Dispatch Active!"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi
        id: check_date
      - name: Checkout code
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for git push

      - name: Set up Python
        if: steps.check_date.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stats Regeneration
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          # Increase timeout for the script if needed inside python 
          # The GH runner has 6 hours max
          PYTHONPATH=".:models:analyzers:utils:scrapers:api" python utils/generate_real_team_stats.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Commit and Push changes
        if: steps.check_date.outputs.should_run == 'true'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          shopt -s nullglob
          stats_files=(data/season_*_team_stats.json)
          if [[ -n $(git status -s "${stats_files[@]}" data/goalie_stats.json data/team_advanced_metrics.json) ]]; then
            echo "Changes detected in data files"
            git add data/season_*_team_stats.json 2>/dev/null || true
            git add data/goalie_stats.json 2>/dev/null || true
            git add data/team_advanced_metrics.json 2>/dev/null || true
            git commit -m "data: automated stats regeneration [skip ci]"
            git push
            echo "✅ Successfully updated stats"
          else
            echo "No changes detected"
          fi
