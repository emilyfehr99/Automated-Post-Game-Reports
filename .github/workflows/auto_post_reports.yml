name: Auto Post NHL Reports

on:
  schedule:
    # 30-minute schedule across all daily NHL game windows (12:00 PM CT to 3:30 AM CT):
    # - Afternoon Window: 17:00 - 23:59 UTC (12:00 PM - 6:59 PM CT)
    - cron: '*/30 17-23 * * *'
    # - Evening & Late Night Window: 00:00 - 08:59 UTC (7:00 PM - 3:59 AM CT)
    - cron: '*/30 0-8 * * *'

  repository_dispatch:  # Allow external triggers (instant when game finishes)
    types: [game-finished]
  workflow_dispatch:  # Allow manual triggering from Actions tab
    inputs:
      monitor_mode:
        description: "Run live monitor daemon (true) or single-pass check (false)"
        required: false
        default: "true"
      force_reprocess_days:
        description: "Replay last N days even if already processed (e.g. 2)"
        required: false
        default: "0"
      allow_twitter_failure:
        description: "If true, do not fail run when X post fails"
        required: false
        default: "false"
      require_twitter_post:
        description: "If false, do not require X post for a game to count as processed"
        required: false
        default: "true"

concurrency:
  group: nhl-live-monitor
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONPATH: ".:models:analyzers:utils:scrapers:api"
    permissions:
      contents: write  # Allow workflow to commit and push
    
    steps:
    - name: Check Active Schedule
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "repository_dispatch" ]]; then
          echo "✅ Dispatch Triggered (${{ github.event_name }})!"
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          result=$(python3 -c "
          import urllib.request, json
          from datetime import datetime, timezone, timedelta

          def check():
              try:
                  req = urllib.request.Request('https://api-web.nhle.com/v1/score/now', headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data = json.loads(r.read().decode('utf-8'))
                  games = data.get('games', [])
                  if not games:
                      req2 = urllib.request.Request('https://api-web.nhle.com/v1/schedule/now', headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req2, timeout=10) as r2:
                          sched = json.loads(r2.read().decode('utf-8'))
                      games = [g for day in sched.get('gameWeek', []) for g in day.get('games', [])]
                      if not games:
                          return False, 'No NHL games scheduled in active schedule window'

                  now_utc = datetime.now(timezone.utc)
                  
                  # 1. Any game currently LIVE or in PRE-game
                  live_games = [g for g in games if g.get('gameState') in ('LIVE', 'CRIT', 'PRE')]
                  if live_games:
                      return True, f'{len(live_games)} game(s) currently LIVE/PRE'
                  
                  # 2. Any game that is FINAL or OFF (needs post-game report generation check)
                  final_games = [g for g in games if g.get('gameState') in ('FINAL', 'OFF')]
                  if final_games:
                      return True, f'{len(final_games)} completed game(s) to verify/process'
                  
                  # 3. Any upcoming game starting within the next 45 minutes
                  starting_soon = []
                  for g in games:
                      start_str = g.get('startTimeUTC')
                      if start_str:
                          start_dt = datetime.fromisoformat(start_str.replace('Z', '+00:00'))
                          if start_dt <= now_utc + timedelta(minutes=45):
                              starting_soon.append(g)
                  
                  if starting_soon:
                      return True, f'{len(starting_soon)} game(s) starting within 45 minutes'
                  
                  return False, 'All games on today slate start in > 45 minutes. Skipping run.'
              except Exception as e:
                  return True, f'Error querying schedule ({e}); defaulting to run.'

          should_run, reason = check()
          print(f'{\"true\" if should_run else \"false\"}|{reason}')
          " 2>/dev/null || echo "true|Fallback default to run")

          should_run=$(echo "$result" | cut -d'|' -f1)
          reason=$(echo "$result" | cut -d'|' -f2)

          if [[ "$should_run" == "true" ]]; then
            echo "✅ $reason"
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "⏸️  $reason"
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi
        fi
      id: check_date

    - name: Checkout repository
      if: steps.check_date.outputs.should_run == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history to ensure we have the latest commits
    
    
    - name: Set up Python
      if: steps.check_date.outputs.should_run == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      if: steps.check_date.outputs.should_run == 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils
    
    - name: Install dependencies
      if: steps.check_date.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Pull latest changes (ensure we have latest processed_games.json)
      if: steps.check_date.outputs.should_run == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        # Pull latest to get any updates to processed_games.json from previous runs
        git pull --rebase origin main || git pull origin main || true
        # Ensure processed_games.json exists
        if [ ! -f processed_games.json ]; then
          echo '{"games": []}' > processed_games.json
          git add -f processed_games.json
        fi
        echo "📋 Current processed_games.json status:"
        if [ -f processed_games.json ]; then
          cat processed_games.json || echo "  (file exists but could not read)"
        else
          echo "  (file does not exist)"
        fi
    
    - name: Check for completed games and post
      if: steps.check_date.outputs.should_run == 'true'
      env:
        # Free X posting: browser cookies (no API credits). See x_cookie_poster.py
        X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        X_CT0: ${{ secrets.X_CT0 }}
        X_POST_MODE: cookie
        TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
        TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
        TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
        TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        LIVE_MONITOR_MODE: ${{ github.event.inputs.monitor_mode || 'true' }}
        MAX_MONITOR_MINUTES: "120"
        FORCE_REPROCESS_DAYS: ${{ github.event.inputs.force_reprocess_days || '0' }}
        ALLOW_TWITTER_FAILURE: ${{ github.event.inputs.allow_twitter_failure || 'false' }}
        REQUIRE_TWITTER_POST: ${{ github.event.inputs.require_twitter_post || 'true' }}
      run: |
        python3 github_actions_runner.py
    
    - name: Commit processed games, team stats, and model learning data
      if: steps.check_date.outputs.should_run == 'true'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "GitHub Actions Bot"
        
        # Pull latest changes to avoid conflicts (multiple runs overlap)
        git pull --rebase --autostash origin main || true
        
        # Ensure processed_games.json exists (create empty if missing)
        if [ ! -f processed_games.json ]; then
          echo '{"games": []}' > processed_games.json
        fi
        
        # Force add files that are in .gitignore but need to be tracked
        # Team stats is updated by daily predictions workflow at 6am CT, so we just commit it if it exists
        shopt -s nullglob
        for stats_file in season_*_team_stats.json data/season_*_team_stats.json; do
          if [ -f "$stats_file" ]; then
            git add -f "$stats_file"
          fi
        done
        # Add other files
        if [ -f "processed_games.json" ]; then
          git add -f processed_games.json
        fi
        if [ -f "win_probability_predictions_v2.json" ]; then
          git add -f win_probability_predictions_v2.json
        fi
        if [ -f "posted_tweets.json" ]; then
          git add -f posted_tweets.json
        fi
        if [ -f "data/goalie_stats.json" ]; then
          git add -f data/goalie_stats.json
        fi
        if [ -f "data/team_advanced_metrics.json" ]; then
          git add -f data/team_advanced_metrics.json
        fi
        
        # Check if there are changes to commit
        if ! git diff --staged --quiet; then
          echo "📝 Committing updated tracking files..."
          git commit -m "Update processed games, team stats, and model learning data [skip ci]"
          # Push with retry (handles concurrent pushes)
          for i in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ Successfully committed and pushed tracking files"
              break
            fi
            echo "⚠️  Push failed (attempt $i). Rebasing and retrying..."
            git pull --rebase --autostash origin main || true
            sleep 2
          done
        else
          echo "ℹ️  No changes to commit (files are up to date)"
        fi
        
        # Verify the file is tracked in git
        if git ls-files --error-unmatch processed_games.json > /dev/null 2>&1; then
          echo "✅ processed_games.json is tracked in git"
        else
          echo "⚠️  WARNING: processed_games.json is not tracked in git!"
        fi
