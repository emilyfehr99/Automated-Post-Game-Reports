name: Unified Hockey Data & Analytics Engine

on:
  schedule:
    # Daily morning analytics consolidation & warehouse sweep: 11:30 UTC (5:30 AM CT / 6:30 AM ET)
    - cron: '30 11 * * *'

  workflow_dispatch:
    inputs:
      mode:
        description: "Execution scope"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - games
          - cards
          - predictions
          - pwhl
          - prospects
          - warehouse
      dry_run:
        description: "Dry run (true = skip social posting)"
        required: false
        default: false
        type: boolean
      game_id:
        description: "Specific NHL Game ID to target (optional)"
        required: false
        default: ""

concurrency:
  group: unified-hockey-engine
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ".:models:analyzers:utils:scrapers:api:nhl-goalie-hub:automated-scraping"
      GOALIE_HUB_ROOT: "${{ github.workspace }}/nhl-goalie-hub"
      AUTOMATED_SCRAPING_ROOT: "${{ github.workspace }}/automated-scraping"

    steps:
      - name: Checkout Automated-Post-Game-Reports
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout NHL Goalie Hub
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: emilyfehr99/nhl-goalie-hub
          path: nhl-goalie-hub
          token: ${{ secrets.GH_PAT || secrets.GOALIE_HUB_SYNC_TOKEN || github.token }}
          fetch-depth: 1

      - name: Checkout Automated Scraping
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: emilyfehr99/automated-scraping
          path: automated-scraping
          token: ${{ secrets.GH_PAT || secrets.GOALIE_HUB_SYNC_TOKEN || github.token }}
          fetch-depth: 1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-liberation

      - name: Install Python & Playwright Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f nhl-goalie-hub/requirements-ci.txt ]; then
            pip install -r nhl-goalie-hub/requirements-ci.txt
          fi
          if [ -f automated-scraping/requirements.txt ]; then
            pip install -r automated-scraping/requirements.txt || true
          fi
          python -m playwright install --with-deps chromium || python -m playwright install chromium

      - name: Pull Latest Changes & Ensure State Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort 2>/dev/null || true; git pull origin main || true)

          if [ ! -f processed_games.json ]; then
            echo '{"games": []}' > processed_games.json
            git add -f processed_games.json
          fi

      - name: Execute Unified Hockey Engine
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          X_POST_MODE: auto
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GOALIE_HUB_SYNC_TOKEN: ${{ secrets.GH_PAT || secrets.GOALIE_HUB_SYNC_TOKEN || github.token }}
        run: |
          EXEC_MODE="${{ github.event.inputs.mode || 'all' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.game_id }}" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --game-id ${{ github.event.inputs.game_id }}"
          fi

          echo "🚀 Running Unified Hockey Pipeline: mode=$EXEC_MODE $EXTRA_FLAGS"
          python3 pipelines/unified_pipeline.py --mode "$EXEC_MODE" $EXTRA_FLAGS

      - name: Commit & Push Tracking Data (Automated-Post-Game-Reports)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "GitHub Actions Bot"

          # Pull latest to avoid push collision
          git pull --rebase -X theirs --autostash origin main || (git rebase --abort 2>/dev/null || true; git pull origin main || true)

          # Stage modified tracking files
          shopt -s nullglob
          for f in processed_games.json posted_tweets.json win_probability_predictions_v2.json data/goalie_stats.json data/team_advanced_metrics.json season_*_team_stats.json data/season_*_team_stats.json; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done

          if ! git diff --staged --quiet; then
            echo "📝 Committing updated tracking and metric states..."
            git commit -m "Update unified pipeline analytics and game states [skip ci]"
            for i in {1..5}; do
              if git push origin HEAD:main; then
                echo "✅ Successfully pushed updates to Automated-Post-Game-Reports"
                break
              fi
              echo "⚠️ Push failed (attempt $i). Rebasing and retrying..."
              git pull --rebase -X theirs --autostash origin main || (git rebase --abort 2>/dev/null || true; git pull origin main || true)
              sleep 2
            done
          else
            echo "ℹ️ No changes to commit in Automated-Post-Game-Reports"
          fi

      - name: Commit & Push Goalie Card States (NHL Goalie Hub)
        if: always()
        run: |
          if [ -d "nhl-goalie-hub/.git" ]; then
            cd nhl-goalie-hub
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "GitHub Actions Bot"

            # Check if posted_goalie_cards.json or warehouse data was modified
            if [ -f "data/posted_goalie_cards.json" ]; then
              git add -f data/posted_goalie_cards.json
            fi
            if [ -d "metrics-warehouse/curated" ]; then
              git add -A metrics-warehouse/curated/
            fi

            if ! git diff --staged --quiet; then
              echo "📝 Committing updated Goalie Hub cards and warehouse states..."
              git commit -m "Update posted goalie cards & warehouse state [skip ci]"
              for i in {1..5}; do
                if git push origin HEAD:main; then
                  echo "✅ Successfully pushed updates to NHL Goalie Hub"
                  break
                fi
                echo "⚠️ Push failed (attempt $i). Rebasing and retrying..."
                git pull --rebase -X theirs --autostash origin main || (git rebase --abort 2>/dev/null || true; git pull origin main || true)
                sleep 2
              done
            else
              echo "ℹ️ No changes to commit in NHL Goalie Hub"
            fi
          fi
